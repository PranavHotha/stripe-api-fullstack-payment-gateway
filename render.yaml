services:
  - type: web
    name: stripe-payment-gateway
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python stripegateway/manage.py migrate
    startCommand: gunicorn --chdir stripegateway stripegateway.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
